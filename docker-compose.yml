version: '3.8'

# Every container pins its own external resolvers instead of inheriting the
# host's. The host resolves via Tailscale MagicDNS (100.100.100.100) only, and
# on a cold boot Docker can create the containers before tailscaled has
# populated /etc/resolv.conf. Docker bakes the upstream list into the embedded
# resolver at container-create time and never revisits it, so those containers
# come up with "NO EXTERNAL NAMESERVERS DEFINED" and cannot resolve Supabase,
# FMP or IBKR until they are force-recreated. Pinning removes the race.
x-external-dns: &external-dns
  - 1.1.1.1
  - 8.8.8.8

services:
  ib-gateway:
    image: heshiming/ibga@sha256:82bba0d8befb40720b4e70be604ca57cc234cc4930ddbaf5cc45ed6f41e586c9
    container_name: ib-gateway
    restart: unless-stopped
    ports:
      - "4002:4000"   # IB Gateway API port
      - "15800:5800"  # Host browser access -> the pinned image's noVNC listener
    environment:
      - IB_USERNAME=${IBKR_LIVE_USER}
      - IB_PASSWORD=${IBKR_LIVE_PASS}
      - TOTP_KEY=${IBKR_TOTP_SECRET}
      - IB_REGION=America
      - IB_TIMEZONE=America/New_York
      - IB_LOGINTAB=IB API
      - IB_LOGINTYPE=Live Trading
      - IB_LOGOFF=11:55 PM
      - IB_APILOG=data
      - IB_LOGLEVEL=Error
    volumes:
      - ib-gateway-program:/home/ibg
      - ib-gateway-settings:/home/ibg_settings
    dns: *external-dns
    networks:
      - trading_bridge

  execution-agent:
    image: ghcr.io/arnabbiswas1510/ai-trading-bot-execution-agent:latest
    container_name: execution-agent
    restart: unless-stopped
    depends_on:
      - ib-gateway
    env_file:
      - .env
      - approved_strategy.env
    environment:
      - IB_GATEWAY_HOST=ib-gateway
      - IB_GATEWAY_PORT=4000
      - TRADING_CONTROL_PATH=/app/control/trading-control.sqlite3
    volumes:
      - /home/pom/docker/ai-trading-bot/logs:/app/logs   # host path — survives container recreations
      - trading-control:/app/control
    logging:
      driver: json-file
      options:
        max-size: "10m"   # Docker json-file capped for live `docker logs` tailing
        max-file: "3"
    dns: *external-dns
    networks:
      - trading_bridge
      - research_bridge

  intraday-observer:
    image: ghcr.io/arnabbiswas1510/ai-trading-bot-execution-agent:latest
    container_name: intraday-observer
    command: ["python", "research_entrypoint.py", "intraday-observer"]
    restart: unless-stopped  # Resume after gateway downtime/reboot, unless explicitly stopped.
    stop_grace_period: 90s
    env_file:
      - .env
      - approved_strategy.env
    environment:
      - IB_GATEWAY_HOST=ib-gateway
      - IB_GATEWAY_PORT=4000
    volumes:
      - /home/pom/docker/ai-trading-bot/logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns: *external-dns
    networks:
      - trading_bridge
      - research_bridge

  research-db:
    image: postgres:17.7-bookworm
    container_name: research-db
    profiles: ["local-research"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${RESEARCH_POSTGRES_PASSWORD:-}
    volumes:
      - ${RESEARCH_DATA_DIR:-/home/pom/docker/ai-trading-bot/research-data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d research"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - research_database

  research-api:
    image: postgrest/postgrest:v12.2.12
    container_name: research-api
    profiles: ["local-research"]
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://authenticator:${RESEARCH_API_PASSWORD:-}@research-db:5432/research
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${RESEARCH_JWT_SECRET:-}
      PGRST_DB_MAX_ROWS: 1000
      PGRST_SERVER_HOST: 0.0.0.0
    depends_on:
      research-db:
        condition: service_healthy
    networks:
      - research_bridge
      - research_database

  research-reporting:
    image: ghcr.io/arnabbiswas1510/ai-trading-bot-shadow:latest
    container_name: research-reporting
    profiles: ["local-research"]
    command: ["python", "research_entrypoint.py", "research-reporting", "--loop"]
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - .env
      - approved_strategy.env
    volumes:
      - ${RESEARCH_DATA_DIR:-/home/pom/docker/ai-trading-bot/research-data}/reporting:/app/reporting-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns: *external-dns
    networks:
      - research_bridge

  shadow-worker:
    image: ghcr.io/arnabbiswas1510/ai-trading-bot-shadow:latest
    container_name: shadow-worker
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - .env
      - approved_strategy.env
    volumes:
      - shadow-data:/app/shadow
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns: *external-dns
    networks:
      - research_bridge

  calibration-worker:
    image: ghcr.io/arnabbiswas1510/ai-trading-bot-shadow:latest
    container_name: calibration-worker
    command: ["python", "research_entrypoint.py", "calibration-worker"]
    restart: unless-stopped
    stop_grace_period: 90s
    env_file:
      - .env
      - approved_strategy.env
    volumes:
      - calibration-data:/app/calibration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    dns: *external-dns
    networks:
      - research_bridge

  trading-bot:
    image: ghcr.io/arnabbiswas1510/ai-trading-bot:latest
    container_name: can-slim-trading-bot
    ports:
      - "8000:8000"
    volumes:
      - bot-data:/app/data
      - trading-control:/app/control
      # NOTE: do NOT bind-mount frontend/dist here. The compiled UI ships inside
      # the image (Dockerfile stage 1 runs `npm run build`, gated by
      # scripts/verify-build.mjs). A host bind mount shadows that directory, and
      # because `dist/` is gitignored the host copy is never refreshed by the
      # deploy's `git reset --hard origin/main` — so the dashboard silently
      # serves whatever bundle was last built by hand on the box, forever.
    restart: unless-stopped
    env_file:
      - .env
      - approved_strategy.env
    environment:
      - DB_PATH=/app/data/trading_bot.db
      - TRADING_CONTROL_PATH=/app/control/trading-control.sqlite3
      - TRADING_RUNTIME_MODE=${TRADING_RUNTIME_MODE:-observe}
    dns: *external-dns
    networks:
      - trading_bridge
      - research_bridge

networks:
  research_database:
    driver: bridge
    internal: true
  research_bridge:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
  trading_bridge:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400

volumes:
  calibration-data:
    driver: local
  trading-control:
    driver: local
  shadow-data:
    driver: local
  bot-data:
    driver: local
  ib-gateway-program:
    driver: local
  ib-gateway-settings:
    driver: local
