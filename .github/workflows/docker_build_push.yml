name: Build and Push Docker Images to GHCR

# No `run-name:` on purpose. GitHub's default run title is the FIRST LINE of the
# head commit message, which is exactly what we want; an explicit `run-name`
# would render the entire multi-line body this project uses for commits. The
# titles were wrong because a bookkeeping commit was landing on top of the real
# work, not because the default was wrong — fixed by `paths-ignore` below plus
# the "do not re-run graphify after applying a patch" rule in AGENTS.md.

on:
  push:
    branches:
      - main
    # Documentation-only pushes cannot change either image: both Dockerfiles
    # COPY an explicit list of source files (no docs/, decisions/ or
    # graphify-out/), and .dockerignore excludes docs/, README.md and AGENTS.md
    # regardless. Building for them wastes a deploy cycle AND — because the
    # knowledge-graph commit is pushed separately after a patch is applied —
    # makes the most recent run describe bookkeeping instead of the change.
    #
    # A push touching BOTH code and docs still builds: paths-ignore only skips
    # when EVERY changed file matches.
    paths-ignore:
      - 'graphify-out/**'
      - 'decisions/**'
      - 'docs/**'
      - '**.md'
      - '*.patch'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase repository owner
        run: |
          echo "OWNER_LC=${OWNER,,}" >> ${GITHUB_ENV}
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Build and push Execution Agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/ai-trading-bot-execution-agent:latest
          # Pass commit SHA so execution agent logs always show the deployed version
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Trading Bot Web App
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/ai-trading-bot:latest
          # BUILD_TIME surfaces in /api/version for deployment tracing.
          # NOTE: GIT_COMMIT does NOT bust the frontend layer cache — `ARG
          # GIT_COMMIT` is declared only in the Dockerfile's stage 2, so the
          # frontend-builder stage never sees it. The `no-cache-filters` below
          # is the only thing forcing a fresh `npm run build`. Do not remove it.
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
          # Cache everything EXCEPT the frontend build layer (frontend-builder stage).
          # `no-cache-filter` targets the stage name defined in the Dockerfile.
          no-cache-filters: frontend-builder
          cache-from: type=gha
          cache-to: type=gha,mode=max
