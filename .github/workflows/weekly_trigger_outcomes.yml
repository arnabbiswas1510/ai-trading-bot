name: Weekly Trigger Outcome Backfill

# Links archived breakout triggers to what actually happened next.
#
# trigger_history records what the screener SAW (final_score, ai_grade, the AI's
# rationale) for every trigger INCLUDING the ones never bought — the control
# group that trade_history lacks. This job supplies the outcomes, which is what
# turns that archive into a test of whether final_score predicts forward return.
#
# Sunday: the 20-session measurement window needs ~34 calendar days to elapse, so
# there is no benefit to running more often, and FMP has a daily request cap.

on:
  schedule:
    - cron: '0 12 * * 0'   # Sundays 12:00 UTC — market closed, no contention
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute and print without writing'
        type: boolean
        default: false
      limit:
        description: 'Cap rows processed (FMP daily request cap)'
        type: string
        default: ''

jobs:
  backfill-outcomes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backfill Trigger Outcomes
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python backfill_trigger_outcomes.py $ARGS
