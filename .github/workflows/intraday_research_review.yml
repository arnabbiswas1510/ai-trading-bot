name: Intraday Research Collection Watchdog

# Runs outside the observer/web host, including while trading is disabled.
# GitHub schedules are best-effort; durable period keys catch up delayed reports.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: intraday-research-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reporting-only dependencies
        run: pip install requests==2.32.3 exchange-calendars==4.13.2
      - name: Install verified Bitwarden CLI
        run: |
          mkdir -p .ci-tools
          curl --fail --silent --show-error --location \
            https://github.com/bitwarden/sdk-sm/releases/download/bws-v2.1.0/bws-x86_64-unknown-linux-gnu-2.1.0.zip \
            --output .ci-tools/bws.zip
          echo 'ba8233c3a4aee5d43e3c73bbd04d99e9bc5aba13bbbfd06d89b073abe732b860  .ci-tools/bws.zip' | sha256sum --check
          unzip -q .ci-tools/bws.zip -d .ci-tools
          chmod +x .ci-tools/bws
          rm .ci-tools/bws.zip
          echo "$GITHUB_WORKSPACE/.ci-tools" >> "$GITHUB_PATH"
      - name: Check collection and deliver due research reports
        env:
          TRADING_RUNTIME_MODE: ${{ vars.TRADING_RUNTIME_MODE || 'observe' }}
          BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m scripts.run_intraday_reporting_bws
