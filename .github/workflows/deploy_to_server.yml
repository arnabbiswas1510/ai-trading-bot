name: Deploy to Production Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Images to GHCR"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy new images to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          timeout: 120s
          script: |
            cd /home/pom/docker/ai-trading-bot

            echo "=== Pulling latest repository code ==="
            git fetch --all
            git reset --hard origin/main

            echo "=== Pulling latest images ==="
            docker compose pull execution-agent trading-bot

            echo "=== Removing old container instances to prevent name conflicts ==="
            docker compose rm -fs execution-agent trading-bot

            echo "=== Starting ib-gateway only if not already running (--no-recreate prevents 2FA disruption) ==="
            docker compose up -d --no-recreate ib-gateway > /dev/null 2>&1
            sleep 5
            docker compose up -d execution-agent trading-bot > /dev/null 2>&1

            echo "=== Pruning log files older than 7 days ==="
            # Belt-and-suspenders: TeeLogger purges on startup too, but this
            # guarantees cleanup even if the container crashed before that ran.
            find /home/pom/docker/ai-trading-bot/logs \
              -maxdepth 1 \
              -name "execution_*.log" \
              -mtime +7 \
              -print \
              -delete \
              2>/dev/null || true

            echo "=== Deployment complete ==="
            docker inspect ib-gateway       --format 'ib-gateway:       {{.State.Status}} (restarts: {{.RestartCount}})'
            docker inspect execution-agent  --format 'execution-agent:  {{.State.Status}} (restarts: {{.RestartCount}})'
            docker inspect can-slim-trading-bot --format 'can-slim-trading-bot: {{.State.Status}} (restarts: {{.RestartCount}})'

            echo "=== Verifying the dashboard actually serves the deployed commit ==="
            # Guards against the class of failure where the image is rebuilt and
            # pulled correctly but the container serves a different bundle (e.g.
            # a host bind mount shadowing /app/frontend/dist). Without this the
            # deploy reports success while the UI silently stays on old code.
            EXPECTED=$(git rev-parse HEAD)
            SERVED=""
            for i in $(seq 1 12); do
              SERVED=$(curl -fsS -m 5 http://localhost:8000/api/version 2>/dev/null \
                       | sed -n 's/.*"git_commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              [ -n "$SERVED" ] && break
              sleep 5
            done

            if [ -z "$SERVED" ]; then
              echo "WARNING: /api/version did not respond; could not verify the served build."
            elif [ "$SERVED" != "$EXPECTED" ]; then
              echo "ERROR: dashboard is serving $SERVED but the repo is at $EXPECTED."
              echo "The container did not pick up the new build. Check for a bind mount"
              echo "shadowing /app/frontend/dist, or a failed image pull."
              exit 1
            else
              echo "OK: dashboard is serving $SERVED"
            fi
            exit 0
