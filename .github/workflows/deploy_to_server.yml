name: Deploy to Production Server

on:
  workflow_run:
    workflows: ["Build and Push Docker Images to GHCR"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deploy artifacts to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: pom
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          # The prod host has no git checkout by design, so the deploy is the
          # ONLY delivery path for these files. We ship the secret-resolution
          # tooling and the scrubbed template, but DO NOT run the resolver here:
          # rendering .env is a manual, operator-validated step (see the SSH
          # script's closing note and decisions/2026-09-27_bitwarden-secret-resolution.md).
          source: "docker-compose.yml,scripts/deploy_runtime.sh,scripts/restart_6am.sh,scripts/render_env.sh,scripts/render_env.py,.env.template"
          target: "/home/pom/docker/ai-trading-bot"

      - name: Deploy new images to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Compatibility label only; the dashboard's persisted control gates entries.
          TRADING_RUNTIME_MODE: ${{ vars.TRADING_RUNTIME_MODE || 'observe' }}
          EXPECTED: ${{ github.event.workflow_run.head_sha || github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: pom
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          timeout: 120s
          envs: TRADING_RUNTIME_MODE,EXPECTED
          script: |
            set -eu
            mkdir -p /home/pom/docker/ai-trading-bot
            cd /home/pom/docker/ai-trading-bot

            echo "=== Ensuring secret-resolution tooling is executable ==="
            chmod +x scripts/deploy_runtime.sh scripts/restart_6am.sh scripts/render_env.sh scripts/render_env.py
            # NOTE: .env is NOT rendered automatically. render_env.sh regenerates
            # .env from Bitwarden + .env.template; running it unattended here would
            # overwrite any hand-tuned host .env before it can be diffed. The
            # operator runs `scripts/render_env.sh` by hand, diffs, then recreates.
            # See decisions/2026-09-27_bitwarden-secret-resolution.md.

            sh scripts/deploy_runtime.sh

            echo "=== Pruning log files older than 7 days ==="
            find /home/pom/docker/ai-trading-bot/logs \
              -maxdepth 1 \
              -name "execution_*.log" \
              -mtime +7 \
              -print \
              -delete \
              2>/dev/null || true

            echo "=== Deployment complete ==="

            echo "=== Verifying the dashboard actually serves the deployed commit ==="
            SERVED=""
            for i in $(seq 1 12); do
              SERVED=$(curl -fsS -m 5 http://localhost:8000/api/version 2>/dev/null \
                       | sed -n 's/.*"git_commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              [ -n "$SERVED" ] && break
              sleep 5
            done

            if [ -z "$SERVED" ]; then
              echo "WARNING: /api/version did not respond; could not verify the served build."
            elif [ "$SERVED" != "$EXPECTED" ]; then
              echo "ERROR: dashboard is serving $SERVED but expected $EXPECTED."
              exit 1
            else
              echo "OK: dashboard is serving $SERVED"
            fi
